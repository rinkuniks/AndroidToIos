[package]
name = "wa-bridge-core"
version = "0.1.0"
edition = "2021"
description = "WA Bridge shared transfer core: transport abstraction, manifest, chunking, checkpoint/resume"
license = "proprietary"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[dev-dependencies]
tempfile = "3"
