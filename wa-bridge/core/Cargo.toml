[package]
name = "wa-bridge-core"
version = "0.1.0"
edition = "2021"
description = "WA Bridge shared transfer core: transport abstraction, manifest, chunking, checkpoint/resume"
license = "proprietary"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }

# Crypto (Plan Phase 1: AEAD framing, Argon2id KDF, key versioning)
aes-gcm = { version = "0.10", features = ["std"] }
argon2 = "0.5"
zeroize = { version = "1", features = ["derive"] }
getrandom = "0.2"

[dev-dependencies]
tempfile = "3"
async-trait = "0.1"
